<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Authentication</title>
<style>
body { font-family: "Segoe UI", Arial, sans-serif; background:#0d1b2a; color:#e0e0e0; padding:30px }
.box { background:#020617; padding:20px; border-radius:8px; border:1px solid #00ffcc33 }
input[type=password] { padding:8px; width:300px; margin-right:8px }
button { padding:8px 12px; background:#00ffcc; color:#000; border:none; border-radius:4px }
</style>
</head>
<body>
<div class="box">
<h3>Admin Access Required</h3>
<p>Please enter the admin password to continue.</p>
<form method="POST" action="/admin">
    <input type="password" name="admin_password" placeholder="Admin Password">
    <button type="submit">Unlock Admin</button>
</form>
</div>
</body>
</html>
